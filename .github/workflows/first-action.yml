name: First workflow
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello World!"
      - name: Print goodbye
        run: echo "Done - bye!"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    steps:
      - name: Print second job message
        run: echo "Second job running after first-job completed!"
