name: First workflow
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print greeting
        run: echo "Hello World!"
      - name: Print goodbye
        run: echo "Done - bye!"

  second-job:
    runs-on: ubuntu-latest
    needs: first-job
    env:
      APP_NAME: "gh-first-action"
    steps:
      - name: Print second job message
        run: echo "Second job running after first-job completed!"
      - name: Show job-level variable
        run: echo "Job-level APP_NAME is $APP_NAME"
      - name: Show step-level variable
        env:
          APP_NAME: "override-for-this-step-only"
          DEPLOY_ENV: "training"
        run: |
          echo "Step-level APP_NAME is $APP_NAME"
          echo "Step-level DEPLOY_ENV is $DEPLOY_ENV"
      - name: Intentional failure (continue-on-error)
        continue-on-error: true
        run: |
          echo "INTENTIONAL_TOLERATED_FAILURE"
          echo "This is a tolerated failure" >&2
          exit 1
      - name: Step after tolerated failure
        run: echo "This still runs because previous step was allowed to fail"
      - name: Intentional failure (stops job)
        run: |
          echo "INTENTIONAL_BLOCKING_FAILURE"
          echo "This is a blocking failure" >&2
          exit 1
